# 前端静态托管 + 反代后端（容器内 web 服务用）
#
# 作用：把 Vite 构建出的 web/dist 交给 Nginx 托管，并把 /api 前缀转发给 api 容器，
# 于是 `docker compose up` 后浏览器直接打开 http://localhost:8080 即可用，
# 不再需要手动 `npm run dev` 起一个开发服务器。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SSE 流式分析接口：必须关掉缓冲，否则事件会被 Nginx 攒够一批才下发，
    # 前端就看不到"逐环节流式"的效果。
    location /api/analyze/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 其余后端接口（/api/...、/docs、/openapi.json）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # 前端单页应用：静态资源命中即返回，未命中的路径回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
