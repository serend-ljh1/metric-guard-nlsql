# CI：每次 push / PR 自动跑离线测试套件与全部离线评测线（无需 API Key、无需外部数据）
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与本地开发环境对齐（本地 .venv 为 Python 3.12）。
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest with coverage gate
        # 全量离线单测；覆盖率门槛锁住整体健康度（本地基线约 83%，门槛取 80% 留少量余量）。
        # 覆盖范围：确定性核心 src/sqlpa + 路由层 apiroutes。
        run: |
          pytest tests -q \
            --cov=src/sqlpa --cov=apiroutes \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Run all offline evaluation suites
        # 单一入口 `run_all.py` 一次跑完全部 7 条离线确定性评测线，并产出总报告 overall.json：
        #   1 business / 2 product / 3 decisions / 4 attribution / 5 alert_quality /
        #   6 sandbox_external / 7 external_bank（Spider dev world_1，用仓库内样本语料）
        # 全部无需 API Key、可离线复现。
        # 未加 --llm：确定性引擎 vs 纯 LLM 的对照线需 Key，CI 中不跑（其状态会显式写入总报告）。
        run: python evaluation/run_all.py --report-dir /tmp/eval_reports

      - name: Compile-check entrypoints
        # 入口脚本语法自检。
        run: |
          python -m compileall -q api.py run_business.py demo_governance.py evaluation tools
          python -c "import ast; ast.parse(open('api.py', encoding='utf-8').read()); print('api.py OK')"

  web:
    # 前端源代码入库（node_modules / dist 已被 .gitignore 排除），CI 校验 lint / 单测 / 构建。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Lint frontend
        # eslint + eslint-plugin-vue：拦截未用变量、可疑控制流等问题。
        working-directory: web
        run: npm run lint

      - name: Unit-test frontend
        # node:test 零依赖单测（含 SSE 事件归并 reduceAgents 的纯函数用例）。
        working-directory: web
        run: npm run test

      - name: Build frontend
        working-directory: web
        run: npm run build
