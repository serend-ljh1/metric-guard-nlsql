# CI：每次 push / PR 自动跑离线测试套件（无需 API Key、无需外部数据）
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest (offline suite)
        run: pytest tests -q

      - name: Business semantic-layer eval (offline, deterministic)
        # 口径命中 / 口径外拒绝 / 权限拦截 / PII 掩码 / 公式防篡改 / 审计留痕
        # 无需 API Key，用同结构样本库；这一步能拦住语义层与治理护栏的回归。
        run: python evaluation/eval_business.py --report-dir /tmp/eval_reports

      - name: Product metrics eval (offline, deterministic)
        # 北极星：语义层命中率 / 口径外占比 / 认证率。语义层是主路径，
        # 这一步保证"覆盖率"不会因为改配置或改匹配规则而悄悄退化。
        run: python evaluation/eval_product.py --report-dir /tmp/eval_reports

      - name: Compile-check entrypoints
        # 入口脚本语法自检（此前的 Streamlit app.py 冒烟步骤在 app.py 下线后一直让 CI 失败，
        # 已替换为对**现存**入口的检查）。
        run: |
          python -m compileall -q api.py run_business.py demo_governance.py evaluation tools
          python -c "import ast; ast.parse(open('api.py', encoding='utf-8').read()); print('api.py OK')"

  web:
    # 前端此前**完全不在版本控制与 CI 里**（web/ 未入库、无构建校验）。
    # 注意：需要先把 web/ 源码提交进仓库（node_modules / dist 已被 .gitignore 排除）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build
