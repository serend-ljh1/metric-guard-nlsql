# 一键启动：docker compose up
#   api -> http://localhost:8000  (FastAPI 后端, /docs 有 Swagger)
# 前端（Vue3 + Vite）不在容器里跑：开发期在 web/ 下 `npm run dev`（5173，已代理到 8000），
# 生产部署请构建 web/dist 后用任意静态服务器托管。
#   （历史：这里曾有 web -> 8501 的 Streamlit 服务，该前端已下线。）
#
# 可选：把真实 Olist 库挂载进去覆盖样本库
#   volumes: - ./data/olist/olist.db:/app/data/olist/olist.db:ro
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    command: uvicorn api:app --host 0.0.0.0 --port 8000
