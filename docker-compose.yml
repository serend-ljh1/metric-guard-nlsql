# 一键启动：docker compose up  →  浏览器打开 http://localhost:8080 即可用
#   web -> http://localhost:8080  (Nginx 托管 Vue3 前端，并把 /api 反代到 api:8000)
#   api -> http://localhost:8000  (FastAPI 后端, /docs 有 Swagger)
#
# 前端在 web/ 里多阶段构建（Node 编译 dist → Nginx 托管），运行时不需要 Node，
# 也不用手动 `npm run dev`。开发期若要热更新，仍可在 web/ 下本地 `npm run dev`。
#
# 可选：把真实 Olist 库挂载进去覆盖样本库
#   volumes: - ./data/olist/olist.db:/app/data/olist/olist.db:ro
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    command: uvicorn api:app --host 0.0.0.0 --port 8000

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api
